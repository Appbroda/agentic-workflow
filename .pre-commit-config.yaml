default_language_version:
  python: python3.12

repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run --directory server ruff check .
        language: system
        pass_filenames: false
      - id: ruff-format
        name: Ruff format
        entry: uv run --directory server ruff format --check .
        language: system
        pass_filenames: false
      - id: mypy
        name: mypy
        entry: uv run --directory server mypy .
        language: system
        pass_filenames: false
