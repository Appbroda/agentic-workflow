name: Deploy

on:
  push:
    branches: [master]

# No stored AWS keys and no repository secrets: the role ARN below is a plain identifier, not a
# credential — the AWS-side trust policy on that role is what actually restricts which repo/branch
# may assume it (see deploy/provision.sh).
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ai-platform
  # arn:aws:iam::118355822219:role/github-actions-deploy-ai-platform, created by deploy/provision.sh,
  # trust-policy-scoped to this exact repository.
  AWS_DEPLOY_ROLE_ARN: arn:aws:iam::118355822219:role/github-actions-deploy-ai-platform

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          set -euo pipefail
          BUILD_REVISION="${GITHUB_SHA}"
          docker build \
            --build-arg BUILD_REVISION="${BUILD_REVISION}" \
            -t "${REGISTRY}/${ECR_REPOSITORY}:latest" \
            -t "${REGISTRY}/${ECR_REPOSITORY}:${BUILD_REVISION}" \
            .
          docker push "${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker push "${REGISTRY}/${ECR_REPOSITORY}:${BUILD_REVISION}"

      - name: Redeploy via SSM
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ai-platform-prod" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "::error::No running instance tagged Name=ai-platform-prod found" >&2
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters 'commands=["bash /opt/agentic-workflow/deploy/redeploy.sh"]' \
            --query "Command.CommandId" --output text)

          for _ in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "redeploy succeeded"; exit 0 ;;
              Failed|Cancelled|TimedOut)
                echo "::error::redeploy $STATUS" >&2
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query "StandardErrorContent" --output text >&2
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "::error::redeploy timed out waiting for SSM command completion" >&2
          exit 1
