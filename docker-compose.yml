  ANTHROPIC_ULTRA_REASONING_EFFORT: ${ANTHROPIC_ULTRA_REASONING_EFFORT:-}
  ANTHROPIC_ULTRA_REASONING_MAX_TOKENS: ${ANTHROPIC_ULTRA_REASONING_MAX_TOKENS:-}
