x-platform-build: &platform-build
  context: .
  target: runtime
  args:
    # The API rejects an unknown/non-Git identity in production. Set this from the exact
    # checkout being deployed: `export BUILD_REVISION=$(git rev-parse HEAD)`.
    BUILD_REVISION: ${BUILD_REVISION:-unknown}

# The performance-tier presets, passed to every service that resolves a model role. Defined
# once and merged into each, because the tier variables are the one part of the model
# configuration a deployment is expected to edit as a set -- and two copies of a set that must
# agree is how the two of them come to disagree.
#
# Empty defaults throughout, deliberately: the unsuffixed variables above are the `high` tier,
# so a deployment that sets none of these offers exactly the one tier it always did. A tier is
# offered only when all four of its roles are set.
x-performance-tiers: &performance-tiers
  ANTHROPIC_LOW_REASONING_MODEL: ${ANTHROPIC_LOW_REASONING_MODEL:-}
  ANTHROPIC_LOW_REASONING_EFFORT: ${ANTHROPIC_LOW_REASONING_EFFORT:-}
  ANTHROPIC_LOW_CODING_MODEL: ${ANTHROPIC_LOW_CODING_MODEL:-}
  ANTHROPIC_LOW_CODING_REASONING_EFFORT: ${ANTHROPIC_LOW_CODING_REASONING_EFFORT:-}
  ANTHROPIC_LOW_CODING_MAX_TOKENS: ${ANTHROPIC_LOW_CODING_MAX_TOKENS:-}
  ANTHROPIC_LOW_REASONING_MAX_TOKENS: ${ANTHROPIC_LOW_REASONING_MAX_TOKENS:-}
  ANTHROPIC_LOW_REVIEW_MODEL: ${ANTHROPIC_LOW_REVIEW_MODEL:-}
  ANTHROPIC_LOW_REVIEW_REASONING_EFFORT: ${ANTHROPIC_LOW_REVIEW_REASONING_EFFORT:-}
  ANTHROPIC_LOW_REVIEW_MAX_TOKENS: ${ANTHROPIC_LOW_REVIEW_MAX_TOKENS:-}
  ANTHROPIC_LOW_SCOPED_FIX_MODEL: ${ANTHROPIC_LOW_SCOPED_FIX_MODEL:-}
  ANTHROPIC_LOW_SCOPED_FIX_REASONING_EFFORT: ${ANTHROPIC_LOW_SCOPED_FIX_REASONING_EFFORT:-}
  ANTHROPIC_LOW_SCOPED_FIX_MAX_TOKENS: ${ANTHROPIC_LOW_SCOPED_FIX_MAX_TOKENS:-}
  ANTHROPIC_MEDIUM_REASONING_MODEL: ${ANTHROPIC_MEDIUM_REASONING_MODEL:-}
  ANTHROPIC_MEDIUM_REASONING_EFFORT: ${ANTHROPIC_MEDIUM_REASONING_EFFORT:-}
  ANTHROPIC_MEDIUM_REASONING_MAX_TOKENS: ${ANTHROPIC_MEDIUM_REASONING_MAX_TOKENS:-}
  ANTHROPIC_MEDIUM_CODING_MODEL: ${ANTHROPIC_MEDIUM_CODING_MODEL:-}
  ANTHROPIC_MEDIUM_CODING_REASONING_EFFORT: ${ANTHROPIC_MEDIUM_CODING_REASONING_EFFORT:-}
  ANTHROPIC_MEDIUM_CODING_MAX_TOKENS: ${ANTHROPIC_MEDIUM_CODING_MAX_TOKENS:-}
  ANTHROPIC_MEDIUM_REVIEW_MODEL: ${ANTHROPIC_MEDIUM_REVIEW_MODEL:-}
  ANTHROPIC_MEDIUM_REVIEW_REASONING_EFFORT: ${ANTHROPIC_MEDIUM_REVIEW_REASONING_EFFORT:-}
  ANTHROPIC_MEDIUM_REVIEW_MAX_TOKENS: ${ANTHROPIC_MEDIUM_REVIEW_MAX_TOKENS:-}
  ANTHROPIC_MEDIUM_SCOPED_FIX_MODEL: ${ANTHROPIC_MEDIUM_SCOPED_FIX_MODEL:-}
  ANTHROPIC_MEDIUM_SCOPED_FIX_REASONING_EFFORT: ${ANTHROPIC_MEDIUM_SCOPED_FIX_REASONING_EFFORT:-}
  ANTHROPIC_MEDIUM_SCOPED_FIX_MAX_TOKENS: ${ANTHROPIC_MEDIUM_SCOPED_FIX_MAX_TOKENS:-}
  ANTHROPIC_HIGH_REASONING_MODEL: ${ANTHROPIC_HIGH_REASONING_MODEL:-}
  ANTHROPIC_HIGH_REASONING_EFFORT: ${ANTHROPIC_HIGH_REASONING_EFFORT:-}
  ANTHROPIC_HIGH_REASONING_MAX_TOKENS: ${ANTHROPIC_HIGH_REASONING_MAX_TOKENS:-}
  ANTHROPIC_HIGH_CODING_MODEL: ${ANTHROPIC_HIGH_CODING_MODEL:-}
  ANTHROPIC_HIGH_CODING_REASONING_EFFORT: ${ANTHROPIC_HIGH_CODING_REASONING_EFFORT:-}
  ANTHROPIC_HIGH_CODING_MAX_TOKENS: ${ANTHROPIC_HIGH_CODING_MAX_TOKENS:-}
  ANTHROPIC_HIGH_REVIEW_MODEL: ${ANTHROPIC_HIGH_REVIEW_MODEL:-}
  ANTHROPIC_HIGH_REVIEW_REASONING_EFFORT: ${ANTHROPIC_HIGH_REVIEW_REASONING_EFFORT:-}
  ANTHROPIC_HIGH_REVIEW_MAX_TOKENS: ${ANTHROPIC_HIGH_REVIEW_MAX_TOKENS:-}
  ANTHROPIC_HIGH_SCOPED_FIX_MODEL: ${ANTHROPIC_HIGH_SCOPED_FIX_MODEL:-}
  ANTHROPIC_HIGH_SCOPED_FIX_REASONING_EFFORT: ${ANTHROPIC_HIGH_SCOPED_FIX_REASONING_EFFORT:-}
